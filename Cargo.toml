[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/atlas-adapters",
  "crates/atlas-contracts",
  "crates/atlas-domain",
  "crates/atlas-document-reader",
  "crates/atlas-library",
  "crates/atlas-parse",
  "crates/atlas-provider-settings",
  "crates/atlas-reading-session",
  "crates/atlas-storage",
  "crates/atlas-translation",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Atlas Reader contributors"]

[workspace.dependencies]
async-trait = "0.1.91"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
