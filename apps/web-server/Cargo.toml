[package]
name = "atlas-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
atlas-adapters = { path = "../../crates/atlas-adapters" }
atlas-domain = { path = "../../crates/atlas-domain" }
atlas-document-reader = { path = "../../crates/atlas-document-reader" }
atlas-library = { path = "../../crates/atlas-library" }
atlas-parse = { path = "../../crates/atlas-parse" }
atlas-provider-settings = { path = "../../crates/atlas-provider-settings" }
atlas-reading-assistant = { path = "../../crates/atlas-reading-assistant" }
atlas-reading-session = { path = "../../crates/atlas-reading-session" }
atlas-storage = { path = "../../crates/atlas-storage" }
atlas-translation = { path = "../../crates/atlas-translation" }
axum = { version = "0.8.6", features = ["http2", "json", "multipart", "tokio"] }
bytes = "1.11.0"
futures-util = "0.3.31"
fs2 = "0.4.3"
hex = "0.4.3"
http = "1.3.1"
mime_guess = "2.0.5"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tokio = { workspace = true, features = ["fs", "io-util", "net", "signal", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["fs"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
